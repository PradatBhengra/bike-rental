name: bikerental

x-app: &app
  build: {context: ., dockerfile: api/Dockerfile}
  image: bikerental-api
  env_file: .env
  environment:
    DATABASE_URL: postgresql://bike:${POSTGRES_PASSWORD}@db:5432/bike
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    S3_ENDPOINT: http://garage:3900
    MODEL_CACHE_DIR: /models
  volumes: [models:/models]
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_started}
  restart: unless-stopped

services:
  db:
    build: db
    image: bikerental-db
    environment: {POSTGRES_USER: bike, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: bike}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bike"], interval: 2s, retries: 30}
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    environment: {GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}", GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN}"}
    volumes: [./garage.toml:/etc/garage.toml:ro, garage:/var/lib/garage]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33
    environment: {MP_WEBROOT: mail}
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    command: --wait --no-dump-schema up
    environment: {DATABASE_URL: "postgres://bike:${POSTGRES_PASSWORD}@db:5432/bike?sslmode=disable"}
    volumes: [./db/migrations:/db/migrations:ro]
    depends_on: {db: {condition: service_healthy}}

  api: *app

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  tracking:
    <<: *app
    command: ["uvicorn", "app.tracking:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips=*"]

  web:
    build: {context: ., dockerfile: web/Dockerfile}
    image: bikerental-web
    environment: {SITE_ADDRESS: "${SITE_ADDRESS}"}
    ports: ["8080:8080"]
    volumes: [caddy:/data]
    depends_on: [api, tracking]
    restart: unless-stopped

  simulator:
    <<: *app
    command: ["python", "-m", "app.simulator", "--rides", "6", "--url", "http://tracking:8001"]
    profiles: [demo]
    restart: "no"

volumes: {pgdata: {}, garage: {}, models: {}, caddy: {}}
